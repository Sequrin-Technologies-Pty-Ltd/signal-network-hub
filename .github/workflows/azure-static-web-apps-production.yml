name: Deploy public site to Azure production

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/azure-static-web-apps-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-static-web-apps-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy committed static output
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Deploy docs directory
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: docs
          skip_app_build: true
